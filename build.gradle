plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
    id 'java'
}

version = project.findProperty('mod_version') ?: '0.1.0'
group = project.findProperty('maven_group') ?: 'com.example'

base {
    archivesName = project.findProperty('archives_base_name') ?: 'tf2-minecraft-mashup'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

loom {
    splitEnvironmentSourceSets()
}

jar {
    from('LICENSE') {
        rename { "${project.base.archivesName.get()}-${it}" }
    }
}
